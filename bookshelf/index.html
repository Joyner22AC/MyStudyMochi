<script id="note-navigation-script">(() => {
  const body = document.body;
  const toggle = document.getElementById('note-toc-toggle');
  const themeToggle = document.getElementById('note-theme-toggle');
  const backToTop = document.getElementById('note-back-to-top');
  const sidebar = document.querySelector('.sidebar');
  if (backToTop) {
    const updateBackToTop = () => {
      const visible = window.scrollY > 360;
      backToTop.hidden = !visible;
      backToTop.setAttribute('aria-hidden', String(!visible));
      backToTop.tabIndex = visible ? 0 : -1;
    };
    updateBackToTop();
    window.addEventListener('scroll', updateBackToTop, {passive:true});
    backToTop.addEventListener('click', () => {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({top:0, behavior:reducedMotion ? 'auto' : 'smooth'});
    });
  }
  if (themeToggle) {
    const updateThemeButton = () => {
      const isDark = document.documentElement.dataset.theme === 'dark';
      themeToggle.textContent = isDark ? '日间' : '夜间';
      themeToggle.setAttribute('aria-label', isDark ? '切换到日间模式' : '切换到夜间模式');
      themeToggle.setAttribute('aria-pressed', String(isDark));
      themeToggle.title = isDark ? '切换到日间模式' : '切换到夜间模式';
    };
    updateThemeButton();
    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('study-notes-theme', next); } catch (_) {}
      updateThemeButton();
    });
  }
  if (!toggle || !sidebar) return;

  const smallScreen = () => window.matchMedia('(max-width: 600px)').matches;
  const mobileOpen = () => body.classList.contains('note-toc-drawer-open');
  const desktopOpen = () => !body.classList.contains('note-toc-collapsed');
  const announce = open => {
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? '关闭目录' : '打开目录');
    toggle.textContent = smallScreen() ? '☰ 目录' : '目录';
  };
  const closeDrawer = restoreFocus => {
    if (!mobileOpen()) return;
    body.classList.remove('note-toc-drawer-open');
    announce(false);
    if (restoreFocus) toggle.focus({ preventScroll:true });
  };

  body.classList.add('note-navigation-ready');
  let saved = null;
  try { saved = localStorage.getItem('study-notes-toc-collapsed'); } catch (_) {}
  if (saved === 'true' && !smallScreen()) body.classList.add('note-toc-collapsed');
  announce(smallScreen() ? mobileOpen() : desktopOpen());

  toggle.addEventListener('click', () => {
    if (smallScreen()) {
      if (mobileOpen()) closeDrawer(false);
      else body.classList.add('note-toc-drawer-open');
      announce(mobileOpen());
      return;
    }
    body.classList.toggle('note-toc-collapsed');
    const open = desktopOpen();
    try { localStorage.setItem('study-notes-toc-collapsed', String(!open)); } catch (_) {}
    announce(open);
  });

  sidebar.querySelectorAll('.toc a').forEach(link => link.addEventListener('click', () => {
    if (!smallScreen() || !mobileOpen()) return;
    closeDrawer(false);
  }));

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && smallScreen() && mobileOpen()) {
      event.preventDefault();
      closeDrawer(true);
    }
  });
  document.addEventListener('click', event => {
    // The dimmed backdrop is the body pseudo-element; close only when it is hit.
    if (smallScreen() && mobileOpen() && event.target === body) closeDrawer(true);
  });

  window.addEventListener('resize', () => {
    closeDrawer(false);
    announce(smallScreen() ? false : desktopOpen());
  }, {passive:true});
})();
</script></body>
