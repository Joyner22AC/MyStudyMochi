  --note-ui-paper:#fff;
  --note-ui-canvas:#f6f7f8;

/* Keep navigation in document flow: it can never sit on top of reading content. */
.note-navigation-controls{
  position:relative;z-index:2;display:flex;align-items:center;gap:2px;width:max-content;max-width:calc(100% - 32px);
  margin:14px auto -18px;transform:translateX(calc((min(1210px,100vw) - 100%)/-2 + 8px));
  padding:4px;border:1px solid rgba(220,226,231,.72);border-radius:14px;
  background:rgba(255,255,255,.66);box-shadow:0 3px 16px rgba(24,39,52,.055);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);
  font:500 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
}
.note-navigation-controls button,.note-navigation-controls a{
  display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 12px;border:0;border-radius:10px;
  background:transparent;color:var(--note-ui-ink);text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color .16s ease,color .16s ease;
}
.note-navigation-controls button:hover,.note-navigation-controls a:hover{background:var(--note-ui-accent-soft);color:#245f86}
.note-navigation-controls button:focus-visible,.note-navigation-controls a:focus-visible,
#manual-toggle:focus-visible,#study-toggle:focus-visible,#manual-panel button:focus-visible,#manual-panel select:focus-visible,#manual-page:focus-visible,
#modern-dsp-learning-sidebar button:focus-visible,#manual-resize:focus-visible,#study-resize:focus-visible{
  outline:3px solid var(--note-ui-focus);outline-offset:2px
}

.note-navigation-controls .note-theme-toggle{min-width:72px}
.note-navigation-catalog-controls{width:max-content;max-width:100%;margin:0 0 22px;transform:none}
body.note-navigation-ready .sidebar{scroll-margin-top:18px}
body.note-toc-collapsed .sidebar{display:none!important}
body.note-toc-collapsed .layout{grid-template-columns:minmax(0,1fr)}

/* A quiet return-to-top affordance appears only after the reader has scrolled. */
#note-back-to-top{
  position:fixed;z-index:80;right:20px;bottom:76px;width:36px;height:36px;min-width:36px;min-height:36px;padding:0;
  border:1px solid rgba(135,151,164,.28);border-radius:50%;background:rgba(250,252,253,.42);
  color:rgba(62,78,91,.72);box-shadow:none;backdrop-filter:blur(12px) saturate(1.15);-webkit-backdrop-filter:blur(12px) saturate(1.15);
  font:400 19px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer;opacity:.64;
  transition:background-color .16s ease,border-color .16s ease,color .16s ease,opacity .16s ease
}
#note-back-to-top:hover{background:rgba(250,252,253,.78);border-color:rgba(111,133,149,.48);color:#344957;opacity:1}
#note-back-to-top:focus-visible{outline:3px solid var(--note-ui-focus);outline-offset:3px}
#note-back-to-top[hidden]{display:none!important}

/* Optional readers stay available but recede visually until needed. */
#manual-toggle,#study-toggle{
  position:fixed;z-index:90;bottom:max(20px,env(safe-area-inset-bottom));min-height:42px;padding:0 15px;border:1px solid rgba(210,220,228,.78);border-radius:14px;
  background:rgba(250,252,253,.70);color:var(--note-ui-ink);box-shadow:0 4px 18px rgba(24,39,52,.075);
  font:500 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer;backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);
  transition:background-color .16s ease,border-color .16s ease,transform .16s ease;
}
#manual-toggle{right:20px}#study-toggle{left:20px}

.manual-header,.study-header{background:rgba(255,255,255,.82);border-color:var(--note-ui-border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

}
#manual-panel button:hover:not(:disabled),.study-header button:hover,.study-tabs button:hover,.study-exercises button:hover{background:var(--note-ui-accent-soft)}
#manual-source,.manual-source,.manual-toolbar,.study-tabs{border-color:var(--note-ui-border)}
#manual-pages,.manual-pdf-page,.study-dock-content{overscroll-behavior:contain}
#manual-resize::after,.study-resize::after{background:#d6dee4}
#manual-resize:hover::after,#manual-resize:focus-visible::after,#study-resize:hover::after,#study-resize:focus-visible::after{background:var(--note-ui-accent)}

</style></head><body><div class="layout" style="grid-template-columns:minmax(0,1fr);max-width:980px"><main class="article"><div class="note-navigation-controls note-navigation-catalog-controls" id="note-navigation-controls"><a aria-label="返回全部课程" href="../index.html" id="note-course-home">全部课程</a><button aria-label="切换到夜间模式" aria-pressed="false" class="note-theme-toggle" id="note-theme-toggle" type="button">夜间</button></div><header class="hero"><div class="eyebrow">学习笔记 · 2026-10-26更新</div><h1>现代信号处理</h1><p class="lead">信号描述 → 采样与恢复 → 数字收发和滤波</p></header><div class="cards"><a class="card" href="现代信号处理_第一章_数字信号处理基础.html"><h2>第一章：数字信号处理基础</h2><p>变换、随机过程、PSD与LTI系统</p></a><a class="card" href="现代信号处理_第二章_信号采样与压缩感知.html"><h2>第二章：信号采样与压缩感知</h2><p>带通/多速率/TIADC、OMP、MWC与多陪集</p></a><a class="card" href="现代信号处理_第三章_数字接收与发射.html"><h2>第三章：数字接收与发射</h2><p>镜像、ADC、DDC、NCO、信道化与 DUC</p></a><a class="card" href="现代信号处理_第四章_滤波与估计.html"><h2>第四章：滤波与估计</h2><p>CIC、半带、匹配滤波、LFM 与 Wiener</p></a></div><p class="source-ref">依据已收到材料持续更新。新笔记公式已预渲染为SVG；旧笔记保留原有路径和内容。原始课件未上传到本次发布。</p></main></div><script id="note-navigation-script">(() => {
  const body = document.body;
  const toggle = document.getElementById('note-toc-toggle');
  const themeToggle = document.getElementById('note-theme-toggle');
  const backToTop = document.getElementById('note-back-to-top');
  const sidebar = document.querySelector('.sidebar');
  if (backToTop) {
    const updateBackToTop = () => {
      const visible = window.scrollY > 360;
      backToTop.hidden = !visible;
      backToTop.setAttribute('aria-hidden', String(!visible));
      backToTop.tabIndex = visible ? 0 : -1;
    };
    updateBackToTop();
    window.addEventListener('scroll', updateBackToTop, {passive:true});
    backToTop.addEventListener('click', () => {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({top:0, behavior:reducedMotion ? 'auto' : 'smooth'});
    });
  }
  if (themeToggle) {
    const updateThemeButton = () => {
      const isDark = document.documentElement.dataset.theme === 'dark';
      themeToggle.textContent = isDark ? '日间' : '夜间';
      themeToggle.setAttribute('aria-label', isDark ? '切换到日间模式' : '切换到夜间模式');
      themeToggle.setAttribute('aria-pressed', String(isDark));
      themeToggle.title = isDark ? '切换到日间模式' : '切换到夜间模式';
    };
    updateThemeButton();
    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('study-notes-theme', next); } catch (_) {}
      updateThemeButton();
    });
  }
  if (!toggle || !sidebar) return;

  const smallScreen = () => window.matchMedia('(max-width: 600px)').matches;
  const mobileOpen = () => body.classList.contains('note-toc-drawer-open');
  const desktopOpen = () => !body.classList.contains('note-toc-collapsed');
  const announce = open => {
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? '关闭目录' : '打开目录');
    toggle.textContent = smallScreen() ? '☰ 目录' : '目录';
  };
  const closeDrawer = restoreFocus => {
    if (!mobileOpen()) return;
    body.classList.remove('note-toc-drawer-open');
    announce(false);
    if (restoreFocus) toggle.focus({ preventScroll:true });
  };

  body.classList.add('note-navigation-ready');
  let saved = null;
  try { saved = localStorage.getItem('study-notes-toc-collapsed'); } catch (_) {}
  if (saved === 'true' && !smallScreen()) body.classList.add('note-toc-collapsed');
  announce(smallScreen() ? mobileOpen() : desktopOpen());

  toggle.addEventListener('click', () => {
    if (smallScreen()) {
      if (mobileOpen()) closeDrawer(false);
      else body.classList.add('note-toc-drawer-open');
      announce(mobileOpen());
      return;
    }
    body.classList.toggle('note-toc-collapsed');
    const open = desktopOpen();
    try { localStorage.setItem('study-notes-toc-collapsed', String(!open)); } catch (_) {}
    announce(open);
  });

  sidebar.querySelectorAll('.toc a').forEach(link => link.addEventListener('click', () => {
    if (!smallScreen() || !mobileOpen()) return;
    closeDrawer(false);
  }));

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && smallScreen() && mobileOpen()) {
      event.preventDefault();
      closeDrawer(true);
    }
  });
  document.addEventListener('click', event => {
    // The dimmed backdrop is the body pseudo-element; close only when it is hit.
    if (smallScreen() && mobileOpen() && event.target === body) closeDrawer(true);
  });

  window.addEventListener('resize', () => {
    closeDrawer(false);
    announce(smallScreen() ? false : desktopOpen());
  }, {passive:true});
})();
</script></body></html>
